[alembic]
script_location = control/db/migrations
prepend_sys_path = .
path_separator = os

# 비밀 · 주소를 여기 하드코딩하지 않는다. env.py가 config의 main option(없으면
# DATABASE_URL 환경 변수, 둘 다 없으면 예외)에서 읽는다.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
